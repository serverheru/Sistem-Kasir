<script>
  let produkList = [];
  let keranjang = [];
  let riwayatList = [];
  let lastReceipt = null;
  let toastTimer = null;
  let catalogView = "compact";
  let produkPage = 1;
  let metodePembayaran = "Tunai";

  const CHART_COLORS = ["#1f7a45", "#d6a02a", "#8a531f", "#14552f", "#a33a25", "#7a6045"];

  const PAGE_META = {
    kasir: { kicker: "Transaksi", title: "Kasir Cepat" },
    riwayat: { kicker: "Riwayat", title: "Riwayat Transaksi" },
    produk: { kicker: "Inventori", title: "Produk & Stok" },
    laporan: { kicker: "Analitik", title: "Laporan Kasir" },
    operasional: { kicker: "SOP", title: "Operasional Kasir" }
  };

  const COFFEE_IMAGES = {
    espresso: "https://images.unsplash.com/photo-1514432324607-a09d9b4aefdd?auto=format&fit=crop&w=900&q=80",
    latte: "https://images.unsplash.com/photo-1570968915860-54d5c301fa9f?auto=format&fit=crop&w=900&q=80",
    cappuccino: "https://images.unsplash.com/photo-1534778101976-62847782c213?auto=format&fit=crop&w=900&q=80",
    americano: "https://images.unsplash.com/photo-1509042239860-f550ce710b93?auto=format&fit=crop&w=900&q=80",
    mocha: "https://images.unsplash.com/photo-1511920170033-f8396924c348?auto=format&fit=crop&w=900&q=80",
    cold: "https://images.unsplash.com/photo-1517701604599-bb29b565090c?auto=format&fit=crop&w=900&q=80",
    manual: "https://images.unsplash.com/photo-1495474472287-4d71bcdd2085?auto=format&fit=crop&w=900&q=80",
    default: "https://images.unsplash.com/photo-1442512595331-e89e73853f31?auto=format&fit=crop&w=900&q=80"
  };

  document.addEventListener("DOMContentLoaded", function () {
    document.getElementById("bayarInput").addEventListener("input", hitungKembalian);
    document.getElementById("searchInput").addEventListener("input", function () {
      produkPage = 1;
      renderProduk();
    });
    document.getElementById("stockFilter").addEventListener("change", function () {
      produkPage = 1;
      renderProduk();
    });
    document.getElementById("categoryFilter").addEventListener("change", function () {
      produkPage = 1;
      renderProduk();
    });
    document.getElementById("pageSizeSelect").addEventListener("change", function () {
      produkPage = 1;
      renderProduk();
    });
    document.getElementById("historySearchInput").addEventListener("input", renderRiwayat);
    window.addEventListener("resize", debounce(renderDashboardCharts, 180));

    // Keyboard shortcuts
    document.addEventListener("keydown", function (e) {
      // Ctrl+S or Cmd+S = simpan transaksi
      if ((e.ctrlKey || e.metaKey) && e.key === "s") {
        e.preventDefault();
        var kasirPage = document.getElementById("page-kasir");
        if (kasirPage && kasirPage.classList.contains("active")) {
          simpan();
        }
      }
      // Escape = close any open dialog
      if (e.key === "Escape") {
        closeSidebar();
      }
    });

    renderKeranjang();
    loadProduk();
    loadRiwayat();
    loadRingkasanHariIni();

    // Dismiss loading overlay after a short delay
    setTimeout(function () {
      var overlay = document.getElementById("loadingOverlay");
      if (overlay) overlay.classList.add("hidden");
    }, 1200);
  });

  function showPage(pageName) {
    var meta = PAGE_META[pageName] || PAGE_META.kasir;

    document.querySelectorAll(".page").forEach(function (page) {
      page.classList.toggle("active", page.id === "page-" + pageName);
    });

    document.querySelectorAll(".nav-link").forEach(function (link) {
      link.classList.toggle("active", link.dataset.page === pageName);
    });

    // Update mobile bottom nav
    document.querySelectorAll(".mobile-nav-btn").forEach(function (btn) {
      btn.classList.toggle("active", btn.dataset.page === pageName);
    });

    closeSidebar();

    document.getElementById("pageKicker").innerText = meta.kicker;
    document.getElementById("pageTitle").innerText = meta.title;

    if (pageName === "riwayat") {
      renderRiwayat();
    }

    if (pageName === "produk" || pageName === "laporan") {
      renderProdukSupportPages();
    }

    if (pageName === "laporan") {
      renderDashboardCharts();
    }

    // Scroll to top on page change
    window.scrollTo({ top: 0, behavior: "smooth" });
  }

  function toggleSidebar() {
    document.querySelector('.sidebar').classList.toggle('mobile-open');
    document.getElementById('sidebarOverlay').classList.toggle('mobile-open');
  }

  function closeSidebar() {
    document.querySelector('.sidebar').classList.remove('mobile-open');
    if (document.getElementById('sidebarOverlay')) {
      document.getElementById('sidebarOverlay').classList.remove('mobile-open');
    }
  }

  function refreshSemua() {
    refreshProduk();
    refreshRiwayat();
  }

  function refreshProduk() {
    loadProduk();
  }

  function loadProduk() {
    setStatus("Memuat produk...");

    google.script.run
      .withSuccessHandler(function (data) {
        produkList = Array.isArray(data) ? data : [];
        produkPage = 1;
        renderKategoriProduk();
        renderProduk();
        renderProdukSupportPages();
        renderDashboardCharts();
        setStatus("Produk diperbarui");
      })
      .withFailureHandler(function (error) {
        tampilkanPesan(error.message || "Gagal memuat produk.", "error");
        setStatus("Gagal memuat produk");
      })
      .getProduk();
  }

  function renderKategoriProduk() {
    const select = document.getElementById("categoryFilter");
    const currentValue = select.value || "all";
    const categories = getCategories();

    select.innerHTML = '<option value="all">Semua kategori</option>';
    categories.forEach(function (category) {
      const option = document.createElement("option");
      option.value = category;
      option.textContent = category;
      select.appendChild(option);
    });

    select.value = categories.indexOf(currentValue) >= 0 ? currentValue : "all";
  }

  function renderProduk() {
    const container = document.getElementById("produkList");
    const empty = document.getElementById("produkEmpty");
    const filtered = getFilteredProduk();
    const pageSize = getProdukPageSize();
    const totalPages = Math.max(Math.ceil(filtered.length / pageSize), 1);

    produkPage = Math.min(Math.max(produkPage, 1), totalPages);

    const start = (produkPage - 1) * pageSize;
    const pageItems = filtered.slice(start, start + pageSize);

    container.className = "product-list view-" + catalogView;
    container.innerHTML = "";
    document.getElementById("produkCount").innerText = filtered.length + " item";
    document.getElementById("produkPageText").innerText = "Halaman " + produkPage + " / " + totalPages;
    document.getElementById("prevProdukBtn").disabled = produkPage <= 1;
    document.getElementById("nextProdukBtn").disabled = produkPage >= totalPages;
    empty.hidden = filtered.length > 0;

    pageItems.forEach(function (produk) {
      container.appendChild(buatKartuProduk(produk));
    });
  }

  function buatKartuProduk(produk) {
    const stok = Number(produk.stok || 0);
    const imageUrl = getCoffeeImage(produk);
    const div = document.createElement("article");
    div.className = "product-card" + (stok <= 0 ? " is-empty" : "");

    div.innerHTML = `
      <div class="product-image-wrap">
        <img class="product-image" src="${escapeAttribute(imageUrl)}" alt="Foto ${escapeAttribute(produk.nama_produk)}" loading="lazy" referrerpolicy="no-referrer" onerror="this.onerror=null; this.src='${escapeAttribute(COFFEE_IMAGES.default)}'">
      </div>
      <div class="product-main">
        <div class="product-title">
          <div>
            <h3>${escapeHtml(produk.nama_produk)}</h3>
            <div class="product-id">${escapeHtml(produk.id_produk)} - ${escapeHtml(getKategoriProduk(produk))}</div>
          </div>
          <span class="${getStockBadgeClass(stok)}">${getStockLabel(stok)}</span>
        </div>
        <div class="product-meta">
          <div class="price">${formatRupiah(produk.harga)}</div>
          <div class="stock-line">
            <span>Stok</span>
            <strong>${stok}</strong>
          </div>
        </div>
      </div>
      <button class="btn primary" type="button" ${stok <= 0 ? "disabled" : ""} onclick="tambahKeKeranjang('${escapeAttribute(produk.id_produk)}')">
        Tambah
      </button>
    `;

    return div;
  }

  function getFilteredProduk() {
    const keyword = document.getElementById("searchInput").value.trim().toLowerCase();
    const stockFilter = document.getElementById("stockFilter").value;
    const categoryFilter = document.getElementById("categoryFilter").value;

    return produkList.filter(function (produk) {
      const stok = Number(produk.stok || 0);
      const kategori = getKategoriProduk(produk);
      const cocokKeyword = !keyword ||
        String(produk.nama_produk).toLowerCase().includes(keyword) ||
        String(produk.id_produk).toLowerCase().includes(keyword) ||
        kategori.toLowerCase().includes(keyword);
      const cocokStok =
        stockFilter === "all" ||
        (stockFilter === "available" && stok > 0) ||
        (stockFilter === "low" && stok > 0 && stok <= 5) ||
        (stockFilter === "empty" && stok <= 0);
      const cocokKategori = categoryFilter === "all" || kategori === categoryFilter;

      return cocokKeyword && cocokStok && cocokKategori;
    });
  }

  function getProdukPageSize() {
    return Number(document.getElementById("pageSizeSelect").value || 24);
  }

  function ubahHalamanProduk(step) {
    produkPage += step;
    renderProduk();
  }

  function setCatalogView(mode) {
    catalogView = mode === "grid" ? "grid" : "compact";
    document.getElementById("compactViewBtn").classList.toggle("active", catalogView === "compact");
    document.getElementById("gridViewBtn").classList.toggle("active", catalogView === "grid");
    renderProduk();
  }

  function tambahKeKeranjang(idProduk) {
    const produk = produkList.find(function (item) {
      return String(item.id_produk) === String(idProduk);
    });

    if (!produk) {
      tampilkanPesan("Produk tidak ditemukan.", "error");
      return;
    }

    const stok = Number(produk.stok || 0);
    const itemKeranjang = keranjang.find(function (item) {
      return String(item.id_produk) === String(idProduk);
    });
    const qtyBaru = itemKeranjang ? itemKeranjang.qty + 1 : 1;

    if (qtyBaru > stok) {
      tampilkanPesan("Stok " + produk.nama_produk + " hanya " + stok + ".", "error");
      return;
    }

    if (itemKeranjang) {
      itemKeranjang.qty = qtyBaru;
    } else {
      keranjang.push({
        id_produk: produk.id_produk,
        nama_produk: produk.nama_produk,
        harga: Number(produk.harga),
        gambar: getCoffeeImage(produk),
        stok: stok,
        qty: 1
      });
    }

    renderKeranjang();
  }

  function renderKeranjang() {
    const container = document.getElementById("keranjangBody");
    container.innerHTML = "";

    if (keranjang.length === 0) {
      container.innerHTML = '<div class="empty-state cart-empty-state">Pilih produk untuk mulai transaksi.</div>';
      hitungTotal();
      return;
    }

    keranjang.forEach(function (item, index) {
      const subtotal = item.harga * item.qty;
      const row = document.createElement("div");
      row.className = "cart-item";

      row.innerHTML = `
        <div class="cart-product">
          <img class="cart-thumb" src="${escapeAttribute(item.gambar || COFFEE_IMAGES.default)}" alt="" loading="lazy" referrerpolicy="no-referrer" onerror="this.onerror=null; this.src='${escapeAttribute(COFFEE_IMAGES.default)}'">
          <div>
            <p class="cart-name">${escapeHtml(item.nama_produk)}</p>
            <div class="cart-meta">${formatRupiah(item.harga)} x ${item.qty} = <strong>${formatRupiah(subtotal)}</strong></div>
          </div>
        </div>
        <div class="qty-control">
          <button type="button" onclick="ubahQty(${index}, ${item.qty - 1})">-</button>
          <input type="number" min="1" max="${item.stok}" value="${item.qty}" onchange="ubahQty(${index}, this.value)">
          <button type="button" onclick="ubahQty(${index}, ${item.qty + 1})">+</button>
        </div>
        <button class="icon-btn" type="button" onclick="hapusItem(${index})" aria-label="Hapus ${escapeAttribute(item.nama_produk)}">X</button>
      `;

      container.appendChild(row);
    });

    hitungTotal();
  }

  function ubahQty(index, value) {
    const item = keranjang[index];
    const qty = Number(value);

    if (!item) {
      return;
    }

    if (qty <= 0) {
      hapusItem(index);
      return;
    }

    if (qty > item.stok) {
      tampilkanPesan("Stok " + item.nama_produk + " hanya " + item.stok + ".", "error");
      item.qty = item.stok;
    } else {
      item.qty = qty;
    }

    renderKeranjang();
  }

  function hapusItem(index) {
    keranjang.splice(index, 1);
    renderKeranjang();
  }

  function kosongkanKeranjang() {
    if (keranjang.length === 0) {
      return;
    }

    keranjang = [];
    renderKeranjang();
    tampilkanPesan("Keranjang dikosongkan.");
  }

  function hitungTotal() {
    const total = getTotal();
    const itemCount = keranjang.reduce(function (sum, item) {
      return sum + item.qty;
    }, 0);

    document.getElementById("totalText").innerText = formatRupiah(total);
    document.getElementById("itemCountText").innerText = itemCount;
    hitungKembalian();

    return total;
  }

  function hitungKembalian() {
    const total = getTotal();
    const bayar = Number(document.getElementById("bayarInput").value || 0);
    const kembalian = Math.max(bayar - total, 0);

    document.getElementById("kembalianText").innerText = formatRupiah(kembalian);
    return kembalian;
  }

  function getTotal() {
    return keranjang.reduce(function (sum, item) {
      return sum + item.harga * item.qty;
    }, 0);
  }

  function setQuickBayar(nominal) {
    document.getElementById("bayarInput").value = nominal;
    hitungKembalian();
  }

  function setBayarPas() {
    document.getElementById("bayarInput").value = getTotal();
    hitungKembalian();
  }

  function setMetodePembayaran(metode) {
    metodePembayaran = metode;
    document.getElementById("btnTunai").classList.toggle("active", metode === "Tunai");
    document.getElementById("btnQris").classList.toggle("active", metode === "QRIS");
    
    if (metode === "QRIS") {
      document.getElementById("quickPaymentsBox").style.display = "none";
      document.getElementById("qrisToolsBox").style.display = "flex";
      setBayarPas();
      document.getElementById("bayarInput").readOnly = true;
    } else {
      document.getElementById("quickPaymentsBox").style.display = "flex";
      document.getElementById("qrisToolsBox").style.display = "none";
      document.getElementById("bayarInput").readOnly = false;
    }
  }

  function bukaDialogQris() {
    const total = hitungTotal();
    if (total <= 0) {
      tampilkanPesan("Keranjang masih kosong.", "error");
      return;
    }
    document.getElementById("qrisNominalText").innerText = formatRupiah(total);
    const dialog = document.getElementById("qrisDialog");
    if (typeof dialog.showModal === "function") {
      dialog.showModal();
    }
  }

  function tutupDialogQris() {
    const dialog = document.getElementById("qrisDialog");
    if (dialog.open) {
      dialog.close();
    }
  }

  function simpan() {
    if (keranjang.length === 0) {
      tampilkanPesan("Keranjang masih kosong.", "error");
      return;
    }

    const bayar = Number(document.getElementById("bayarInput").value || 0);
    const total = hitungTotal();

    if (bayar < total) {
      tampilkanPesan("Uang bayar kurang " + formatRupiah(total - bayar) + ".", "error");
      return;
    }

    const payload = {
      items: keranjang.map(function (item) {
        return {
          id_produk: item.id_produk,
          qty: item.qty
        };
      }),
      nama_pembeli: document.getElementById("namaPembeliInput").value.trim(),
      bayar: bayar,
      metode_pembayaran: metodePembayaran
    };

    setSavingState(true);
    setStatus("Menyimpan transaksi...");

    google.script.run
      .withSuccessHandler(function (response) {
        lastReceipt = {
          response: response,
          items: keranjang.map(function (item) {
            return Object.assign({}, item);
          })
        };

        tampilkanStruk(lastReceipt);
        tampilkanPesan("Transaksi berhasil disimpan.");

        keranjang = [];
        document.getElementById("bayarInput").value = "";
        document.getElementById("namaPembeliInput").value = "";
        setMetodePembayaran("Tunai"); // Reset ke Tunai setelah simpan
        renderKeranjang();
        loadProduk();
        loadRiwayat();
        loadRingkasanHariIni();
        setSavingState(false);
      })
      .withFailureHandler(function (error) {
        tampilkanPesan(error.message || "Transaksi gagal disimpan.", "error");
        setSavingState(false);
        setStatus("Transaksi gagal");
      })
      .simpanTransaksi(payload);
  }

  function loadRiwayat() {
    setStatus("Memuat riwayat...");

    google.script.run
      .withSuccessHandler(function (data) {
        riwayatList = Array.isArray(data) ? data : [];
        renderRiwayat();
        renderDashboardCharts();
        setStatus("Siap");
      })
      .withFailureHandler(function (error) {
        tampilkanPesan(error.message || "Gagal memuat riwayat.", "error");
        setStatus("Gagal memuat riwayat");
      })
      .getRiwayatTransaksi();
  }

  function refreshRiwayat() {
    loadRiwayat();
    loadRingkasanHariIni();
  }

  function loadRingkasanHariIni() {
    google.script.run
      .withSuccessHandler(function (data) {
        renderStats(data || {});
      })
      .withFailureHandler(function () {
        renderStats({});
      })
      .getRingkasanHariIni();
  }

  function renderRiwayat() {
    const tbody = document.getElementById("riwayatBody");
    const keyword = document.getElementById("historySearchInput").value.trim().toLowerCase();
    const filtered = riwayatList.filter(function (item) {
      return !keyword ||
        String(item.id_transaksi).toLowerCase().includes(keyword) ||
        String(item.tanggal).toLowerCase().includes(keyword) ||
        String(item.nama_pembeli || "").toLowerCase().includes(keyword);
    });
    const omzet = filtered.reduce(function (sum, item) {
      return sum + Number(item.total || 0);
    }, 0);

    tbody.innerHTML = "";
    document.getElementById("historyCountText").innerText = filtered.length + " transaksi";
    document.getElementById("historyRevenueText").innerText = formatRupiah(omzet);

    filtered.forEach(function (item) {
      const tr = document.createElement("tr");
      const metode = item.metode_pembayaran || "Tunai";
      const metodeClass = metode === "QRIS" ? "stock-badge" : "pill";
      tr.innerHTML = `
        <td>${escapeHtml(item.id_transaksi)}</td>
        <td>${escapeHtml(item.tanggal)}</td>
        <td>${escapeHtml(item.nama_pembeli || "-")}</td>
        <td>${Number(item.jumlah_item || 0)}</td>
        <td>${formatRupiah(item.total)}</td>
        <td>${formatRupiah(item.bayar)}</td>
        <td>${formatRupiah(item.kembalian)}</td>
        <td><span class="${metodeClass}">${escapeHtml(metode)}</span></td>
      `;
      tbody.appendChild(tr);
    });
  }

  function renderStats(data) {
    const jumlahTransaksi = Number(data.jumlah_transaksi || 0);
    const omzet = Number(data.omzet || 0);

    document.getElementById("todayCountText").innerText = jumlahTransaksi;
    document.getElementById("todayRevenueText").innerText = formatRupiah(omzet);
    document.getElementById("soldCountText").innerText = Number(data.jumlah_item || 0);
    document.getElementById("avgTransactionText").innerText = formatRupiah(jumlahTransaksi ? omzet / jumlahTransaksi : 0);
    
    if (document.getElementById("omzetQrisText")) document.getElementById("omzetQrisText").innerText = formatRupiah(data.omzet_qris || 0);
    if (document.getElementById("omzetTunaiText")) document.getElementById("omzetTunaiText").innerText = formatRupiah(data.omzet_tunai || 0);
    if (document.getElementById("topProdukText")) document.getElementById("topProdukText").innerText = data.produk_terlaris || "-";

    renderDashboardCharts();
  }

  function renderProdukSupportPages() {
    const totalProduk = produkList.length;
    const lowStock = produkList.filter(function (produk) {
      const stok = Number(produk.stok || 0);
      return stok > 0 && stok <= 5;
    });
    const emptyStock = produkList.filter(function (produk) {
      return Number(produk.stok || 0) <= 0;
    });
    const activeProducts = produkList.filter(function (produk) {
      return Number(produk.stok || 0) > 0;
    });
    const stockValue = produkList.reduce(function (sum, produk) {
      return sum + Number(produk.harga || 0) * Number(produk.stok || 0);
    }, 0);

    document.getElementById("produkTotalText").innerText = totalProduk;
    document.getElementById("produkLowText").innerText = lowStock.length;
    document.getElementById("stockValueText").innerText = formatRupiah(stockValue);
    document.getElementById("activeProductText").innerText = activeProducts.length;
    document.getElementById("emptyProductText").innerText = emptyStock.length;

    renderProdukTable();
    renderLowStockList(lowStock.concat(emptyStock).slice(0, 8));
  }

  function renderProdukTable() {
    const tbody = document.getElementById("produkTableBody");
    tbody.innerHTML = "";

    produkList.forEach(function (produk) {
      const stok = Number(produk.stok || 0);
      const tr = document.createElement("tr");
      tr.innerHTML = `
        <td>
          <div class="table-product">
            <img src="${escapeAttribute(getCoffeeImage(produk))}" alt="" loading="lazy" referrerpolicy="no-referrer" onerror="this.onerror=null; this.src='${escapeAttribute(COFFEE_IMAGES.default)}'">
            <div>
              <strong>${escapeHtml(produk.nama_produk)}</strong>
              <span>${escapeHtml(produk.id_produk)}</span>
            </div>
          </div>
        </td>
        <td>${escapeHtml(getKategoriProduk(produk))}</td>
        <td>${formatRupiah(produk.harga)}</td>
        <td>${stok}</td>
        <td><span class="${getStockBadgeClass(stok)}">${getStockLabel(stok)}</span></td>
        <td>
          <div class="table-actions">
            <button class="btn soft compact-btn" type="button" onclick="bukaFormProduk('${escapeAttribute(produk.id_produk)}')">Edit</button>
            <button class="btn ghost compact-btn danger-text" type="button" onclick="hapusProdukClient('${escapeAttribute(produk.id_produk)}')">Hapus</button>
          </div>
        </td>
      `;
      tbody.appendChild(tr);
    });
  }

  function bukaFormProduk(idProduk) {
    const dialog = document.getElementById("produkDialog");
    const produk = idProduk ? produkList.find(function (item) {
      return String(item.id_produk) === String(idProduk);
    }) : null;

    document.getElementById("produkDialogTitle").innerText = produk ? "Edit Produk" : "Tambah Produk";
    document.getElementById("produkOriginalId").value = produk ? produk.id_produk : "";
    document.getElementById("produkIdInput").value = produk ? produk.id_produk : "";
    document.getElementById("produkIdInput").readOnly = Boolean(produk);
    document.getElementById("produkNamaInput").value = produk ? produk.nama_produk : "";
    document.getElementById("produkHargaInput").value = produk ? Number(produk.harga || 0) : "";
    document.getElementById("produkStokInput").value = produk ? Number(produk.stok || 0) : "";
    document.getElementById("produkGambarInput").value = produk ? String(produk.gambar_asli || produk.gambar || "") : "";

    if (typeof dialog.showModal === "function") {
      dialog.showModal();
    }
  }

  function tutupFormProduk() {
    const dialog = document.getElementById("produkDialog");

    if (dialog.open) {
      dialog.close();
    }
  }

  function simpanFormProduk(event) {
    event.preventDefault();

    const payload = {
      original_id: document.getElementById("produkOriginalId").value.trim(),
      id_produk: document.getElementById("produkIdInput").value.trim(),
      nama_produk: document.getElementById("produkNamaInput").value.trim(),
      harga: Number(document.getElementById("produkHargaInput").value || 0),
      stok: Number(document.getElementById("produkStokInput").value || 0),
      gambar: document.getElementById("produkGambarInput").value.trim()
    };

    setProdukSavingState(true);

    google.script.run
      .withSuccessHandler(function (response) {
        tampilkanPesan(response.message || "Produk berhasil disimpan.");
        setProdukSavingState(false);
        tutupFormProduk();
        loadProduk();
      })
      .withFailureHandler(function (error) {
        tampilkanPesan(error.message || "Produk gagal disimpan.", "error");
        setProdukSavingState(false);
      })
      .simpanProduk(payload);
  }

  function hapusProdukClient(idProduk) {
    const produk = produkList.find(function (item) {
      return String(item.id_produk) === String(idProduk);
    });
    const namaProduk = produk ? produk.nama_produk : idProduk;

    if (!confirm("Hapus produk " + namaProduk + "?")) {
      return;
    }

    google.script.run
      .withSuccessHandler(function (response) {
        tampilkanPesan(response.message || "Produk berhasil dihapus.");
        loadProduk();
      })
      .withFailureHandler(function (error) {
        tampilkanPesan(error.message || "Produk gagal dihapus.", "error");
      })
      .hapusProduk(idProduk);
  }

  function setProdukSavingState(isSaving) {
    const button = document.getElementById("produkSubmitBtn");
    button.disabled = isSaving;
    button.innerText = isSaving ? "Menyimpan..." : "Simpan Produk";
  }

  function renderLowStockList(items) {
    const container = document.getElementById("lowStockList");

    if (items.length === 0) {
      container.innerHTML = '<div class="empty-state">Semua stok aman.</div>';
      return;
    }

    container.innerHTML = items.map(function (produk) {
      const stok = Number(produk.stok || 0);
      return `
        <div class="mini-list-item">
          <div>
            <strong>${escapeHtml(produk.nama_produk)}</strong>
            <span>${escapeHtml(getKategoriProduk(produk))}</span>
          </div>
          <span class="${getStockBadgeClass(stok)}">${stok} stok</span>
        </div>
      `;
    }).join("");
  }

  function renderDashboardCharts() {
    if (!document.getElementById("trendChart")) {
      return;
    }

    drawLineChart("trendChart", getRevenueTrendData());
    drawPieChart("categoryPieChart", getStockByCategoryData(), "categoryPieLegend");
    drawBarChart("stockBarChart", getTopStockData());
    if (document.getElementById("metodePieChart")) {
      drawPieChart("metodePieChart", getMetodePieData(), "metodePieLegend");
    }
  }

  function getMetodePieData() {
    const map = { "Tunai": 0, "QRIS": 0 };

    riwayatList.forEach(function (item) {
      const metode = item.metode_pembayaran || "Tunai";
      if (metode === "QRIS") {
        map["QRIS"] += Number(item.total || 0);
      } else {
        map["Tunai"] += Number(item.total || 0);
      }
    });

    return [
      { label: "Tunai", value: map["Tunai"] },
      { label: "QRIS", value: map["QRIS"] }
    ];
  }

  function getRevenueTrendData() {
    const days = [];
    const map = {};

    for (let i = 6; i >= 0; i--) {
      const date = new Date();
      date.setDate(date.getDate() - i);

      const key = [
        date.getFullYear(),
        String(date.getMonth() + 1).padStart(2, "0"),
        String(date.getDate()).padStart(2, "0")
      ].join("-");

      map[key] = 0;
      days.push({
        key: key,
        label: String(date.getDate()).padStart(2, "0") + "/" + String(date.getMonth() + 1).padStart(2, "0")
      });
    }

    riwayatList.forEach(function (item) {
      const key = getRiwayatDateKey(item.tanggal);

      if (Object.prototype.hasOwnProperty.call(map, key)) {
        map[key] += Number(item.total || 0);
      }
    });

    return days.map(function (day) {
      return {
        label: day.label,
        value: map[day.key]
      };
    });
  }

  function getStockByCategoryData() {
    const map = {};

    produkList.forEach(function (produk) {
      const kategori = getKategoriProduk(produk);
      map[kategori] = (map[kategori] || 0) + Number(produk.stok || 0);
    });

    return Object.keys(map).map(function (label) {
      return {
        label: label,
        value: map[label]
      };
    });
  }

  function getTopStockData() {
    return produkList
      .slice()
      .sort(function (a, b) {
        return Number(b.stok || 0) - Number(a.stok || 0);
      })
      .slice(0, 8)
      .map(function (produk) {
        return {
          label: produk.nama_produk,
          value: Number(produk.stok || 0)
        };
      });
  }

  function drawLineChart(canvasId, data) {
    const chart = prepareCanvas(canvasId);

    if (!chart) {
      return;
    }

    const ctx = chart.ctx;
    const width = chart.width;
    const height = chart.height;
    const padding = { top: 18, right: 18, bottom: 34, left: 54 };
    const maxValue = Math.max.apply(null, data.map(function (item) { return item.value; }).concat([1]));
    const plotWidth = width - padding.left - padding.right;
    const plotHeight = height - padding.top - padding.bottom;

    clearChart(ctx, width, height);
    drawChartGrid(ctx, padding, width, height);

    ctx.strokeStyle = "#1f7a45";
    ctx.lineWidth = 3;
    ctx.beginPath();

    data.forEach(function (item, index) {
      const x = padding.left + (data.length === 1 ? 0 : index * (plotWidth / (data.length - 1)));
      const y = padding.top + plotHeight - (item.value / maxValue) * plotHeight;

      if (index === 0) {
        ctx.moveTo(x, y);
      } else {
        ctx.lineTo(x, y);
      }
    });

    ctx.stroke();

    data.forEach(function (item, index) {
      const x = padding.left + (data.length === 1 ? 0 : index * (plotWidth / (data.length - 1)));
      const y = padding.top + plotHeight - (item.value / maxValue) * plotHeight;

      ctx.fillStyle = "#d6a02a";
      ctx.beginPath();
      ctx.arc(x, y, 4, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = "#7a6045";
      ctx.font = "11px sans-serif";
      ctx.textAlign = "center";
      ctx.fillText(item.label, x, height - 12);
    });

    ctx.fillStyle = "#7a6045";
    ctx.font = "11px sans-serif";
    ctx.textAlign = "right";
    ctx.fillText(formatRupiah(maxValue), padding.left - 8, padding.top + 4);
    ctx.fillText("Rp 0", padding.left - 8, padding.top + plotHeight);
  }

  function drawPieChart(canvasId, data, legendId) {
    const chart = prepareCanvas(canvasId);

    if (!chart) {
      return;
    }

    const ctx = chart.ctx;
    const width = chart.width;
    const height = chart.height;
    const total = data.reduce(function (sum, item) {
      return sum + Number(item.value || 0);
    }, 0);
    const centerX = width / 2;
    const centerY = height / 2;
    const radius = Math.max(Math.min(width, height) / 2 - 18, 10);
    let startAngle = -Math.PI / 2;

    clearChart(ctx, width, height);

    if (total <= 0) {
      drawNoData(ctx, width, height);
      renderChartLegend(legendId, []);
      return;
    }

    data.forEach(function (item, index) {
      const angle = (item.value / total) * Math.PI * 2;
      ctx.beginPath();
      ctx.moveTo(centerX, centerY);
      ctx.fillStyle = CHART_COLORS[index % CHART_COLORS.length];
      ctx.arc(centerX, centerY, radius, startAngle, startAngle + angle);
      ctx.closePath();
      ctx.fill();
      startAngle += angle;
    });

    renderChartLegend(legendId, data);
  }

  function drawBarChart(canvasId, data) {
    const chart = prepareCanvas(canvasId);

    if (!chart) {
      return;
    }

    const ctx = chart.ctx;
    const width = chart.width;
    const height = chart.height;
    const padding = { top: 16, right: 22, bottom: 18, left: 120 };
    const rowHeight = Math.max((height - padding.top - padding.bottom) / Math.max(data.length, 1), 18);
    const maxValue = Math.max.apply(null, data.map(function (item) { return item.value; }).concat([1]));

    clearChart(ctx, width, height);

    if (data.length === 0) {
      drawNoData(ctx, width, height);
      return;
    }

    data.forEach(function (item, index) {
      const y = padding.top + index * rowHeight + 4;
      const barWidth = (Number(item.value || 0) / maxValue) * (width - padding.left - padding.right);

      ctx.fillStyle = "#7a6045";
      ctx.font = "12px sans-serif";
      ctx.textAlign = "right";
      ctx.fillText(limitText(item.label, 17), padding.left - 10, y + rowHeight / 2 + 4);

      ctx.fillStyle = index % 2 === 0 ? "#1f7a45" : "#d6a02a";
      roundedRect(ctx, padding.left, y, Math.max(barWidth, 3), rowHeight - 8, 5);
      ctx.fill();

      ctx.fillStyle = "#2b1a10";
      ctx.textAlign = "left";
      ctx.fillText(String(item.value), padding.left + barWidth + 7, y + rowHeight / 2 + 4);
    });
  }

  function prepareCanvas(canvasId) {
    const canvas = document.getElementById(canvasId);

    if (!canvas) {
      return null;
    }

    // Baca dimensi nyata dari wrapper (aspect-ratio CSS), bukan dari atribut HTML
    const wrapper = canvas.parentElement;
    const wrapRect = wrapper ? wrapper.getBoundingClientRect() : null;
    const width = Math.max(
      Math.floor((wrapRect && wrapRect.width) || canvas.clientWidth || canvas.parentElement.clientWidth || 320),
      260
    );
    const height = Math.max(
      Math.floor((wrapRect && wrapRect.height) || canvas.clientHeight || 220),
      80
    );
    const ratio = window.devicePixelRatio || 1;
    const ctx = canvas.getContext("2d");

    canvas.width = width * ratio;
    canvas.height = height * ratio;
    canvas.style.width = "100%";
    canvas.style.height = "100%";
    ctx.setTransform(ratio, 0, 0, ratio, 0, 0);

    return {
      ctx: ctx,
      width: width,
      height: height
    };
  }

  function clearChart(ctx, width, height) {
    ctx.clearRect(0, 0, width, height);
  }

  function drawChartGrid(ctx, padding, width, height) {
    const plotHeight = height - padding.top - padding.bottom;

    ctx.strokeStyle = "#e4d0ad";
    ctx.lineWidth = 1;

    for (let i = 0; i <= 3; i++) {
      const y = padding.top + (plotHeight / 3) * i;
      ctx.beginPath();
      ctx.moveTo(padding.left, y);
      ctx.lineTo(width - padding.right, y);
      ctx.stroke();
    }
  }

  function drawNoData(ctx, width, height) {
    ctx.fillStyle = "#7a6045";
    ctx.font = "13px sans-serif";
    ctx.textAlign = "center";
    ctx.fillText("Belum ada data", width / 2, height / 2);
  }

  function renderChartLegend(legendId, data) {
    const legend = document.getElementById(legendId);

    if (!legend) {
      return;
    }

    legend.innerHTML = data.map(function (item, index) {
      return `
        <span>
          <i style="background:${CHART_COLORS[index % CHART_COLORS.length]}"></i>
          ${escapeHtml(item.label)} (${item.value})
        </span>
      `;
    }).join("");
  }

  function roundedRect(ctx, x, y, width, height, radius) {
    ctx.beginPath();
    ctx.moveTo(x + radius, y);
    ctx.lineTo(x + width - radius, y);
    ctx.quadraticCurveTo(x + width, y, x + width, y + radius);
    ctx.lineTo(x + width, y + height - radius);
    ctx.quadraticCurveTo(x + width, y + height, x + width - radius, y + height);
    ctx.lineTo(x + radius, y + height);
    ctx.quadraticCurveTo(x, y + height, x, y + height - radius);
    ctx.lineTo(x, y + radius);
    ctx.quadraticCurveTo(x, y, x + radius, y);
    ctx.closePath();
  }

  function getRiwayatDateKey(value) {
    const match = String(value || "").match(/^(\d{2})\/(\d{2})\/(\d{4})/);

    if (!match) {
      return "";
    }

    return match[3] + "-" + match[2] + "-" + match[1];
  }

  function limitText(text, maxLength) {
    const value = String(text || "");
    return value.length > maxLength ? value.slice(0, maxLength - 1) + "..." : value;
  }

  function debounce(fn, delay) {
    let timer = null;

    return function () {
      clearTimeout(timer);
      timer = setTimeout(fn, delay);
    };
  }

  function tampilkanStruk(receipt) {
    const dialog = document.getElementById("receiptDialog");
    const content = document.getElementById("receiptContent");
    const response = receipt.response;
    const itemRows = receipt.items.map(function (item) {
      return `
        <div class="receipt-line">
          <span>${escapeHtml(item.nama_produk)} x ${item.qty}</span>
          <strong>${formatRupiah(item.harga * item.qty)}</strong>
        </div>
      `;
    }).join("");

    content.innerHTML = `
      <div class="receipt-store">
        <strong>Heru's Coffee</strong>
        <span>Coffee Point of Sale</span>
      </div>
      <div class="receipt-separator"></div>
      <div class="receipt-line"><span>ID</span><strong>${escapeHtml(response.id_transaksi)}</strong></div>
      <div class="receipt-line"><span>Pembeli</span><strong>${escapeHtml(response.nama_pembeli || "-")}</strong></div>
      <div class="receipt-line"><span>Waktu</span><strong>${escapeHtml(response.tanggal || "-")}</strong></div>
      <div class="receipt-line"><span>Metode</span><strong>${escapeHtml(response.metode_pembayaran || "Tunai")}</strong></div>
      <div class="receipt-separator"></div>
      ${itemRows}
      <div class="receipt-separator"></div>
      <div class="receipt-line"><span>Total</span><strong>${formatRupiah(response.total)}</strong></div>
      <div class="receipt-line"><span>Bayar</span><strong>${formatRupiah(response.bayar)}</strong></div>
      <div class="receipt-line"><span>Kembalian</span><strong>${formatRupiah(response.kembalian)}</strong></div>
    `;

    if (typeof dialog.showModal === "function") {
      dialog.showModal();
    }
  }

  function tutupStruk() {
    const dialog = document.getElementById("receiptDialog");

    if (dialog.open) {
      dialog.close();
    }
  }

  function setSavingState(isSaving) {
    const button = document.getElementById("simpanBtn");
    button.disabled = isSaving;
    button.innerText = isSaving ? "Menyimpan..." : "Simpan Transaksi";
  }

  function setStatus(text) {
    document.getElementById("statusText").innerText = text;
  }

  function tampilkanPesan(message, type) {
    var toast = document.getElementById("toast");
    var icon = type === "error" ? "✕" : "✓";
    toast.innerHTML = "<span style='font-size:16px;line-height:1;'>" + icon + "</span> " + message;
    toast.style.background = type === "error" ? "#dc2626" : "#1c1612";
    toast.className = "toast show" + (type === "error" ? " toast-error" : "");

    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () {
      toast.className = "toast";
    }, 3200);
  }

  function getCategories() {
    const map = {};

    produkList.forEach(function (produk) {
      map[getKategoriProduk(produk)] = true;
    });

    return Object.keys(map).sort();
  }

  function getKategoriProduk(produk) {
    const nama = String(produk.nama_produk || "").toLowerCase();

    if (nama.includes("kopi") || nama.includes("coffee") || nama.includes("espresso") || nama.includes("latte") || nama.includes("americano") || nama.includes("cappuccino")) {
      return "Kopi";
    }

    if (nama.includes("teh") || nama.includes("tea") || nama.includes("mineral") || nama.includes("soda") || nama.includes("jus")) {
      return "Minuman";
    }

    if (nama.includes("roti") || nama.includes("toast") || nama.includes("mie") || nama.includes("nasi") || nama.includes("snack")) {
      return "Makanan";
    }

    return "Lainnya";
  }

  function getStockBadgeClass(stok) {
    if (stok <= 0) {
      return "stock-badge empty";
    }

    if (stok <= 5) {
      return "stock-badge low";
    }

    return "stock-badge";
  }

  function getStockLabel(stok) {
    if (stok <= 0) {
      return "Habis";
    }

    if (stok <= 5) {
      return "Menipis";
    }

    return "Tersedia";
  }

  function getCoffeeImage(produk) {
    const customImage = String(produk.gambar || "").trim();

    if (customImage) {
      return normalizeImageUrl(customImage);
    }

    const nama = String(produk.nama_produk || "").toLowerCase();

    if (nama.includes("espresso")) {
      return COFFEE_IMAGES.espresso;
    }

    if (nama.includes("latte") || nama.includes("susu") || nama.includes("aren") || nama.includes("caramel")) {
      return COFFEE_IMAGES.latte;
    }

    if (nama.includes("cappuccino") || nama.includes("kapucino")) {
      return COFFEE_IMAGES.cappuccino;
    }

    if (nama.includes("americano") || nama.includes("long black")) {
      return COFFEE_IMAGES.americano;
    }

    if (nama.includes("mocha") || nama.includes("moka") || nama.includes("coklat")) {
      return COFFEE_IMAGES.mocha;
    }

    if (nama.includes("ice") || nama.includes("iced") || nama.includes("cold") || nama.includes("es kopi")) {
      return COFFEE_IMAGES.cold;
    }

    if (nama.includes("v60") || nama.includes("manual") || nama.includes("filter")) {
      return COFFEE_IMAGES.manual;
    }

    return COFFEE_IMAGES.default;
  }

  function normalizeImageUrl(url) {
    const driveFileId = getGoogleDriveFileId(url);

    if (driveFileId) {
      return "https://drive.google.com/thumbnail?id=" + encodeURIComponent(driveFileId) + "&sz=w900";
    }

    return url;
  }

  function getGoogleDriveFileId(url) {
    const filePathMatch = url.match(/drive\.google\.com\/file\/d\/([^/]+)/i);

    if (filePathMatch && filePathMatch[1]) {
      return filePathMatch[1];
    }

    const queryMatch = url.match(/[?&]id=([^&]+)/i);

    if (url.indexOf("drive.google.com") !== -1 && queryMatch && queryMatch[1]) {
      return queryMatch[1];
    }

    return "";
  }

  function formatRupiah(angka) {
    return new Intl.NumberFormat("id-ID", {
      style: "currency",
      currency: "IDR",
      minimumFractionDigits: 0
    }).format(Number(angka || 0));
  }

  function escapeHtml(value) {
    return String(value == null ? "" : value)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#039;");
  }

  function escapeAttribute(value) {
    return escapeHtml(value).replace(/`/g, "&#096;");
  }
</script>

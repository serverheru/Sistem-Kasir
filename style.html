<style>
  :root {
    --bg: #f5eddf;
    --panel: #fffaf0;
    --panel-strong: #fffdf7;
    --ink: #2b1a10;
    --muted: #7a6045;
    --line: #e4d0ad;
    --primary: #1f7a45;
    --primary-dark: #14552f;
    --accent: #d6a02a;
    --accent-dark: #8a531f;
    --danger: #a33a25;
    --soft: #ecf4df;
    --gold-soft: #fff0bf;
    --brown-soft: #efe0ca;
    --shadow: 0 18px 45px rgba(63, 42, 25, 0.16);
  }

  * {
    box-sizing: border-box;
  }

  html {
    scrollbar-gutter: stable;
  }

  body {
    margin: 0;
    background:
      linear-gradient(180deg, #fffaf0 0%, #f4e5c9 48%, #f0dfc2 100%),
      linear-gradient(135deg, rgba(31, 122, 69, 0.1), transparent 42%),
      linear-gradient(315deg, rgba(214, 160, 42, 0.16), transparent 38%),
      var(--bg);
    color: var(--ink);
    font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    line-height: 1.45;
  }

  button,
  input,
  select {
    font: inherit;
  }

  button {
    -webkit-tap-highlight-color: transparent;
    white-space: nowrap;
  }

  /* Sidebar selalu sebagai overlay slide-in — hamburger selalu tampil */
  .app-frame {
    display: block;
    min-height: 100vh;
  }

  .sidebar {
    position: fixed;
    top: 0;
    left: 0;
    bottom: 0;
    width: 272px;
    height: 100vh;
    z-index: 50;
    display: flex;
    flex-direction: column;
    gap: 18px;
    padding: 22px 18px;
    background: linear-gradient(180deg, #2b1a10 0%, #14552f 100%);
    color: #fffdf7;
    transform: translateX(-100%);
    transition: transform 0.32s cubic-bezier(0.4, 0, 0.2, 1),
                box-shadow 0.32s ease;
    box-shadow: none;
  }

  .sidebar.mobile-open {
    transform: translateX(0);
    box-shadow: 6px 0 40px rgba(43, 26, 16, 0.32);
  }

  .brand-block {
    display: grid;
    grid-template-columns: 48px minmax(0, 1fr);
    gap: 12px;
    align-items: center;
  }

  .brand-mark {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 48px;
    height: 48px;
    border-radius: 8px;
    background: var(--accent);
    color: var(--ink);
    font-weight: 900;
  }

  .brand-block h1,
  .topbar h2,
  .panel h3,
  .receipt-header h3 {
    margin: 0;
    letter-spacing: 0;
  }

  .brand-block h1 {
    font-size: 19px;
    line-height: 1.08;
  }

  .eyebrow,
  .section-kicker {
    color: var(--accent-dark);
    font-size: 12px;
    font-weight: 800;
    letter-spacing: 0.08em;
    margin: 0 0 6px;
    text-transform: uppercase;
  }

  .sidebar .eyebrow {
    color: #f4cf71;
  }

  .nav-menu {
    display: grid;
    gap: 8px;
  }

  .nav-link {
    display: flex;
    align-items: center;
    min-height: 44px;
    border: 1px solid rgba(255, 250, 240, 0.16);
    border-radius: 8px;
    background: rgba(255, 250, 240, 0.07);
    color: #fffdf7;
    cursor: pointer;
    font-weight: 850;
    text-align: left;
    padding: 10px 12px;
  }

  .nav-link.active,
  .nav-link:hover {
    background: var(--gold-soft);
    color: var(--ink);
  }

  .sidebar-status {
    margin-top: auto;
    border: 1px solid rgba(255, 250, 240, 0.18);
    border-radius: 8px;
    padding: 12px;
    background: rgba(255, 250, 240, 0.08);
  }

  .sidebar-status span {
    display: block;
    color: #f4cf71;
    font-size: 12px;
    font-weight: 800;
    margin-bottom: 4px;
    text-transform: uppercase;
  }

  .main-shell {
    min-width: 0;
    padding: 22px;
  }

  .topbar,
  .panel,
  .stat-card {
    background: rgba(255, 250, 240, 0.94);
    border: 1px solid rgba(228, 208, 173, 0.94);
    box-shadow: var(--shadow);
  }

  .topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    margin-bottom: 18px;
    padding: 18px 20px;
    min-height: 92px;
    border-radius: 8px;
    background: linear-gradient(180deg, #fffdf7 0%, #fff6df 100%);
  }

  .topbar-left {
    display: flex;
    align-items: center;
    gap: 16px;
  }

  /* Hamburger selalu tampil — sidebar selalu overlay */
  .hamburger-btn {
    display: flex;
    align-items: center;
    justify-content: center;
    background: rgba(255, 253, 247, 0.9);
    color: var(--ink);
    border: 1px solid var(--line);
    box-shadow: 0 2px 8px rgba(63, 42, 25, 0.12);
    transition: background 0.16s ease;
  }

  .hamburger-btn:hover {
    background: var(--gold-soft);
    transform: none;
  }

  .sidebar-overlay {
    display: block;
    position: fixed;
    inset: 0;
    background: rgba(43, 26, 16, 0);
    z-index: 40;
    pointer-events: none;        /* tidak menghalangi klik saat sidebar tertutup */
    backdrop-filter: blur(0px);
    transition: background 0.3s ease, backdrop-filter 0.3s ease;
  }

  .sidebar-overlay.mobile-open {
    background: rgba(43, 26, 16, 0.52);
    backdrop-filter: blur(2px);
    pointer-events: auto;        /* aktif saat sidebar terbuka */
  }

  .topbar h2 {
    font-size: clamp(26px, 3vw, 38px);
    line-height: 1.05;
  }

  .topbar-actions {
    flex-shrink: 0;
  }

  .topbar-actions .btn {
    min-width: 132px;
  }

  .topbar-actions,
  .quick-payments,
  .receipt-actions,
  .panel-actions,
  .table-actions,
  .catalog-subtools,
  .pagination-bar {
    display: flex;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
  }

  .page {
    display: none;
  }

  .page.active {
    display: block;
  }

  /* Kasir: layout dua kolom, catalog bisa scroll mandiri */
  .pos-layout {
    display: grid;
    grid-template-columns: minmax(0, 1fr) 390px;
    gap: 18px;
    align-items: stretch;     /* kedua kolom mengisi tinggi yang sama */
    height: calc(100vh - 158px); /* viewport - topbar (92px) - padding (22px*2) - gap (18px) */
  }

  /* Catalog panel: panel header & toolbar tetap, product list scroll */
  .catalog-panel {
    display: flex;
    flex-direction: column;
    height: 100%;
    overflow: hidden;
  }

  .catalog-panel .product-list,
  .catalog-panel #produkEmpty {
    flex: 1;
    overflow-y: auto;
    min-height: 0;
    padding-right: 4px;
    scroll-behavior: smooth;
  }

  /* Scrollbar tipis agar tidak memakan tempat */
  .catalog-panel .product-list::-webkit-scrollbar {
    width: 5px;
  }
  .catalog-panel .product-list::-webkit-scrollbar-track {
    background: transparent;
  }
  .catalog-panel .product-list::-webkit-scrollbar-thumb {
    background: var(--line);
    border-radius: 999px;
  }

  /* Pagination terdorong ke paling bawah panel */
  .catalog-panel .pagination-bar {
    margin-top: auto;
    flex-shrink: 0;
  }

  .panel {
    border-radius: 8px;
    padding: 18px;
  }

  .panel h3 {
    font-size: 22px;
    line-height: 1.15;
  }

  .panel-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 14px;
    min-height: 44px;
    margin-bottom: 14px;
  }

  .catalog-tools,
  .toolbar.two-cols {
    display: grid;
    grid-template-columns: minmax(0, 1fr) minmax(136px, 170px) minmax(136px, 160px);
    gap: 12px;
    align-items: end;
    margin-bottom: 12px;
  }

  .toolbar.two-cols {
    grid-template-columns: minmax(260px, 1fr) 220px;
  }

  .search-box,
  .field {
    display: grid;
    gap: 7px;
    min-width: 0;
    color: var(--muted);
    font-size: 13px;
    font-weight: 800;
  }

  .compact-field,
  .page-size-field {
    min-width: 138px;
  }

  .catalog-tools > *,
  .toolbar.two-cols > * {
    min-width: 0;
  }

  .catalog-subtools {
    justify-content: space-between;
    margin-bottom: 2px;
  }

  .page-size-field {
    max-width: 138px;
  }

  input,
  select {
    width: 100%;
    min-height: 42px;
    border: 1px solid var(--line);
    border-radius: 8px;
    color: var(--ink);
    background: var(--panel-strong);
    padding: 10px 12px;
    outline: none;
  }

  input:focus,
  select:focus {
    border-color: var(--primary);
    box-shadow: 0 0 0 3px rgba(31, 122, 69, 0.16);
  }

  .segmented {
    display: inline-grid;
    grid-template-columns: 1fr 1fr;
    border: 1px solid var(--line);
    border-radius: 8px;
    overflow: hidden;
    background: var(--panel-strong);
  }

  .segment {
    min-height: 38px;
    border: 0;
    background: transparent;
    color: var(--muted);
    cursor: pointer;
    font-weight: 850;
    padding: 8px 12px;
  }

  .segment.active {
    background: var(--primary);
    color: #fffdf7;
  }

  .product-list {
    display: grid;
    gap: 10px;
    margin-top: 12px;
    contain: layout;
  }

  .product-list.view-grid {
    grid-template-columns: repeat(auto-fill, minmax(205px, 1fr));
    gap: 12px;
  }

  .product-card {
    display: grid;
    gap: 12px;
    min-width: 0;
    border: 1px solid var(--line);
    border-radius: 8px;
    background: linear-gradient(180deg, #fffdf7 0%, #fff6e6 100%);
    padding: 10px;
    overflow: hidden;
  }

  .product-card.is-empty {
    opacity: 0.62;
  }

  .view-compact .product-card {
    grid-template-columns: 76px minmax(0, 1fr) 106px;
    align-items: center;
    min-height: 96px;
  }

  .view-compact .product-card .btn,
  .view-grid .product-card .btn {
    width: 100%;
  }

  .view-grid .product-card {
    align-content: space-between;
    min-height: 306px;
  }

  .product-image-wrap {
    position: relative;
    width: 100%;
    aspect-ratio: 16 / 10;
    border-radius: 8px;
    overflow: hidden;
    background: var(--brown-soft);
  }

  .view-compact .product-image-wrap {
    width: 76px;
    height: 76px;
    aspect-ratio: auto;
  }

  .product-image-wrap::after {
    content: "";
    position: absolute;
    inset: 0;
    background: linear-gradient(180deg, transparent 55%, rgba(43, 26, 16, 0.34));
    pointer-events: none;
  }

  .product-image {
    width: 100%;
    height: 100%;
    display: block;
    object-fit: cover;
    transition: transform 0.24s ease;
  }

  .product-card:hover .product-image {
    transform: scale(1.04);
  }

  .product-main {
    display: grid;
    gap: 8px;
    min-width: 0;
  }

  .product-title {
    display: flex;
    justify-content: space-between;
    gap: 10px;
    align-items: flex-start;
    min-width: 0;
  }

  .product-title h3 {
    margin: 0;
    font-size: 16px;
    line-height: 1.25;
    overflow-wrap: anywhere;
  }

  .product-id {
    color: var(--muted);
    font-size: 12px;
    margin-top: 4px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .product-meta {
    display: flex;
    align-items: end;
    justify-content: space-between;
    gap: 12px;
    min-width: 0;
  }

  .price {
    color: var(--primary-dark);
    font-size: 20px;
    font-weight: 900;
  }

  .stock-line {
    display: grid;
    gap: 2px;
    color: var(--muted);
    font-size: 12px;
    text-align: right;
  }

  .pill,
  .stock-badge {
    min-width: 74px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-height: 28px;
    border-radius: 999px;
    padding: 5px 10px;
    background: var(--soft);
    color: var(--primary-dark);
    font-size: 12px;
    font-weight: 850;
    white-space: nowrap;
  }

  .stock-badge.low {
    background: var(--gold-soft);
    color: var(--accent-dark);
  }

  .stock-badge.empty {
    background: #f8e0d6;
    color: var(--danger);
  }

  .btn,
  .icon-btn {
    border: 0;
    border-radius: 8px;
    min-height: 40px;
    cursor: pointer;
    font-weight: 850;
    transition: transform 0.16s ease, box-shadow 0.16s ease, background 0.16s ease;
  }

  .btn {
    padding: 10px 14px;
  }

  .compact-btn {
    min-height: 34px;
    padding: 7px 10px;
  }

  .btn:hover,
  .icon-btn:hover {
    transform: translateY(-1px);
  }

  .btn.primary,
  .btn.checkout {
    background: linear-gradient(180deg, var(--primary) 0%, var(--primary-dark) 100%);
    color: #fffdf7;
    box-shadow: inset 0 -1px 0 rgba(43, 26, 16, 0.22);
  }

  .btn.primary:hover,
  .btn.checkout:hover {
    background: var(--primary-dark);
  }

  .btn.checkout {
    width: 100%;
    min-height: 50px;
    margin-top: 12px;
  }

  .btn.ghost {
    background: var(--panel-strong);
    color: var(--ink);
    border: 1px solid var(--line);
  }

  .btn.soft {
    background: var(--gold-soft);
    color: #4f321c;
    border: 1px solid rgba(214, 160, 42, 0.28);
  }

  .btn.danger,
  .danger-text {
    color: var(--danger);
  }

  .btn:disabled {
    cursor: not-allowed;
    opacity: 0.55;
    transform: none;
  }

  .cart-panel {
    position: sticky;
    top: 22px;
    max-height: calc(100vh - 44px);
    overflow: auto;
  }

  .cart-list {
    display: grid;
    gap: 10px;
    height: min(42vh, 430px);
    min-height: 180px;
    max-height: min(42vh, 430px);
    overflow: auto;
    padding-right: 4px;
  }

  .cart-empty-state {
    min-height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .cart-item {
    display: grid;
    grid-template-columns: minmax(0, 1fr) 118px 36px;
    gap: 10px;
    align-items: center;
    padding: 12px;
    border: 1px solid var(--line);
    border-radius: 8px;
    background: var(--panel-strong);
  }

  .cart-product,
  .table-product {
    display: grid;
    grid-template-columns: 48px minmax(0, 1fr);
    gap: 10px;
    align-items: center;
    min-width: 0;
  }

  .table-product strong,
  .table-product span {
    display: block;
  }

  .table-actions {
    justify-content: flex-start;
  }

  .cart-thumb,
  .table-product img {
    width: 48px;
    height: 48px;
    border-radius: 8px;
    object-fit: cover;
    background: var(--brown-soft);
  }

  .cart-name {
    margin: 0 0 4px;
    font-weight: 900;
    overflow-wrap: anywhere;
  }

  .cart-meta,
  .table-product span {
    color: var(--muted);
    font-size: 13px;
  }

  .qty-control {
    display: grid;
    grid-template-columns: 30px 1fr 30px;
    align-items: center;
    border: 1px solid var(--line);
    border-radius: 8px;
    overflow: hidden;
  }

  .qty-control button {
    min-height: 36px;
    border: 0;
    background: #f3e3c5;
    color: var(--ink);
    cursor: pointer;
    font-weight: 900;
  }

  .qty-control input {
    min-height: 36px;
    border: 0;
    border-left: 1px solid var(--line);
    border-right: 1px solid var(--line);
    border-radius: 0;
    text-align: center;
    padding: 4px;
  }

  .icon-btn {
    width: 36px;
    min-width: 36px;
    background: #f8e0d6;
    color: var(--danger);
  }

  .checkout-box {
    border-top: 1px solid var(--line);
    margin-top: 16px;
    padding-top: 16px;
  }

  .totals,
  .change-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
    margin-bottom: 14px;
  }

  .totals div,
  .change-row,
  .history-summary,
  .metric-list div {
    background: #fff6e6;
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 12px;
  }

  .history-summary {
    display: grid;
    align-content: center;
    min-height: 66px;
  }

  .totals span,
  .change-row span,
  .stat-card span,
  .history-summary span,
  .metric-list span {
    display: block;
    color: var(--muted);
    font-size: 12px;
    font-weight: 850;
    margin-bottom: 5px;
    text-transform: uppercase;
  }

  .totals strong,
  .change-row strong,
  .stat-card strong,
  .history-summary strong,
  .metric-list strong {
    font-size: 20px;
  }

  .quick-payments {
    margin: 10px 0 14px;
  }

  .pagination-bar {
    justify-content: space-between;
    border-top: 1px solid var(--line);
    margin-top: 14px;
    padding-top: 14px;
    color: var(--muted);
    font-weight: 850;
  }

  .stats-row {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 14px;
    margin-bottom: 18px;
  }

  .stat-card {
    border-radius: 8px;
    padding: 16px;
    min-height: 92px;
    background: linear-gradient(135deg, #fffdf7 0%, #fff0bf 100%);
  }

  .metric-list div {
    min-height: 74px;
  }

  .support-grid {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 18px;
  }

  .chart-grid {
    display: grid;
    grid-template-columns: minmax(0, 1.15fr) minmax(320px, 0.85fr);
    gap: 18px;
    margin-bottom: 18px;
  }

  .chart-card {
    min-width: 0;
  }

  /* Wrapper rasio responsif agar canvas tidak terdistorsi */
  .chart-canvas-wrap {
    position: relative;
    width: 100%;
    border-radius: 8px;
    overflow: hidden;
    background: rgba(255, 253, 247, 0.6);
  }

  .chart-canvas-wrap.ratio-16-5 {
    aspect-ratio: 16 / 5;
  }

  .chart-canvas-wrap.ratio-4-3 {
    aspect-ratio: 4 / 3;
  }

  .chart-canvas-wrap.ratio-16-6 {
    aspect-ratio: 16 / 6;
  }

  .chart-card canvas {
    display: block;
    width: 100% !important;
    height: 100% !important;
    border-radius: 8px;
  }

  .wide-chart {
    grid-column: 1 / -1;
  }

  .chart-legend {
    display: flex;
    flex-wrap: wrap;
    gap: 8px 12px;
    margin-top: 12px;
    color: var(--muted);
    font-size: 12px;
    font-weight: 800;
  }

  .chart-legend span {
    display: inline-flex;
    align-items: center;
    gap: 6px;
  }

  .chart-legend i {
    width: 10px;
    height: 10px;
    border-radius: 999px;
    display: inline-block;
  }

  .metric-list,
  .mini-list,
  .checklist,
  .tips-list {
    display: grid;
    gap: 10px;
  }

  .mini-list-item {
    display: flex;
    justify-content: space-between;
    gap: 12px;
    align-items: center;
    border: 1px solid var(--line);
    border-radius: 8px;
    background: var(--panel-strong);
    padding: 12px;
  }

  .mini-list-item > div {
    min-width: 0;
  }

  .mini-list-item > div span,
  .tips-list p {
    color: var(--muted);
  }

  .mini-list-item > .stock-badge {
    flex-shrink: 0;
  }

  .checklist label {
    display: grid;
    grid-template-columns: 20px minmax(0, 1fr);
    gap: 10px;
    align-items: start;
    border: 1px solid var(--line);
    border-radius: 8px;
    background: var(--panel-strong);
    padding: 12px;
    font-weight: 750;
  }

  .checklist input {
    width: 18px;
    min-height: 18px;
    margin: 2px 0 0;
  }

  .table-wrap {
    overflow-x: auto;
  }

  table {
    width: 100%;
    border-collapse: collapse;
  }

  th,
  td {
    border-bottom: 1px solid var(--line);
    padding: 12px 10px;
    text-align: left;
    white-space: nowrap;
  }

  th {
    color: var(--muted);
    font-size: 12px;
    text-transform: uppercase;
    background: #fff7e8;
  }

  .empty-state {
    border: 1px dashed var(--line);
    border-radius: 8px;
    color: var(--muted);
    background: rgba(255, 253, 247, 0.62);
    padding: 18px;
    text-align: center;
  }

  .toast {
    position: fixed;
    right: 24px;
    bottom: 24px;
    z-index: 20;
    max-width: min(420px, calc(100vw - 48px));
    transform: translateY(20px);
    opacity: 0;
    pointer-events: none;
    border-radius: 8px;
    background: #2b1a10;
    color: #fff;
    padding: 12px 14px;
    box-shadow: var(--shadow);
    transition: opacity 0.2s ease, transform 0.2s ease;
  }

  .toast.show {
    opacity: 1;
    transform: translateY(0);
  }

  .receipt-dialog {
    width: min(460px, calc(100vw - 32px));
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 0;
    color: var(--ink);
    background: var(--panel-strong);
  }

  .form-dialog {
    width: min(620px, calc(100vw - 32px));

<style>
  :root {
    --bg: #f5eddf;
    --panel: #fffaf0;
    --panel-strong: #fffdf7;
    --ink: #2b1a10;
    --muted: #7a6045;
    --line: #e4d0ad;
    --primary: #1f7a45;
    --primary-dark: #14552f;
    --accent: #d6a02a;
    --accent-dark: #8a531f;
    --danger: #a33a25;
    --soft: #ecf4df;
    --gold-soft: #fff0bf;
    --brown-soft: #efe0ca;
    --shadow: 0 18px 45px rgba(63, 42, 25, 0.16);
  }

  * {
    box-sizing: border-box;
  }

  body {
    margin: 0;
    background:
      linear-gradient(180deg, #fffaf0 0%, #f4e5c9 48%, #f0dfc2 100%),
      linear-gradient(135deg, rgba(31, 122, 69, 0.1), transparent 42%),
      linear-gradient(315deg, rgba(214, 160, 42, 0.16), transparent 38%),
      var(--bg);
    color: var(--ink);
    font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }

  button,
  input,
  select {
    font: inherit;
  }

  .app-shell {
    max-width: 1440px;
    margin: 0 auto;
    padding: 28px;
  }

  .topbar,
  .panel,
  .stat-card {
    background: rgba(255, 250, 240, 0.93);
    border: 1px solid rgba(228, 208, 173, 0.94);
    box-shadow: var(--shadow);
  }

  .topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 18px;
    padding: 22px 24px;
    border-radius: 8px;
    margin-bottom: 20px;
    background: linear-gradient(180deg, #fffdf7 0%, #fff6df 100%);
  }

  .topbar h1,
  .panel h2 {
    margin: 0;
    letter-spacing: 0;
  }

  .topbar h1 {
    font-size: clamp(28px, 3vw, 42px);
    line-height: 1;
  }

  .eyebrow,
  .section-kicker {
    color: var(--accent-dark);
    font-size: 12px;
    font-weight: 800;
    letter-spacing: 0.08em;
    margin: 0 0 6px;
    text-transform: uppercase;
  }

  .topbar-actions,
  .quick-payments,
  .receipt-actions {
    display: flex;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
  }

  .dashboard {
    display: grid;
    grid-template-columns: minmax(0, 1.35fr) minmax(360px, 0.65fr);
    gap: 20px;
    align-items: start;
  }

  .panel {
    border-radius: 8px;
    padding: 20px;
  }

  .panel-header {
    display: flex;
    justify-content: space-between;
    gap: 16px;
    align-items: center;
    margin-bottom: 16px;
  }

  .toolbar {
    display: grid;
    grid-template-columns: minmax(220px, 1fr) 180px;
    gap: 12px;
    margin-bottom: 16px;
  }

  .search-box,
  .field {
    display: grid;
    gap: 7px;
    color: var(--muted);
    font-size: 13px;
    font-weight: 700;
  }

  input,
  select {
    width: 100%;
    min-height: 42px;
    border: 1px solid var(--line);
    border-radius: 8px;
    color: var(--ink);
    background: var(--panel-strong);
    padding: 10px 12px;
    outline: none;
  }

  input:focus,
  select:focus {
    border-color: var(--primary);
    box-shadow: 0 0 0 3px rgba(31, 122, 69, 0.16);
  }

  .product-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(210px, 1fr));
    gap: 12px;
  }

  .product-card {
    display: grid;
    gap: 12px;
    align-content: space-between;
    min-height: 306px;
    padding: 12px;
    border: 1px solid var(--line);
    border-radius: 8px;
    background: linear-gradient(180deg, #fffdf7 0%, #fff6e6 100%);
    overflow: hidden;
  }

  .product-card.is-empty {
    opacity: 0.62;
  }

  .product-image-wrap {
    position: relative;
    aspect-ratio: 16 / 10;
    border-radius: 8px;
    overflow: hidden;
    background: var(--brown-soft);
  }

  .product-image-wrap::after {
    content: "";
    position: absolute;
    inset: 0;
    background: linear-gradient(180deg, transparent 55%, rgba(43, 26, 16, 0.34));
    pointer-events: none;
  }

  .product-image {
    width: 100%;
    height: 100%;
    display: block;
    object-fit: cover;
    transition: transform 0.24s ease;
  }

  .product-card:hover .product-image {
    transform: scale(1.04);
  }

  .product-title {
    display: flex;
    justify-content: space-between;
    gap: 12px;
    align-items: flex-start;
  }

  .product-title h3 {
    margin: 0;
    font-size: 17px;
    line-height: 1.25;
  }

  .product-id {
    color: var(--muted);
    font-size: 12px;
    margin-top: 5px;
  }

  .price {
    color: var(--primary-dark);
    font-size: 20px;
    font-weight: 850;
  }

  .stock-line {
    display: flex;
    justify-content: space-between;
    gap: 10px;
    color: var(--muted);
    font-size: 13px;
  }

  .pill,
  .stock-badge {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-height: 28px;
    border-radius: 999px;
    padding: 5px 10px;
    background: var(--soft);
    color: var(--primary-dark);
    font-size: 12px;
    font-weight: 800;
    white-space: nowrap;
  }

  .stock-badge.low {
    background: var(--gold-soft);
    color: var(--accent-dark);
  }

  .stock-badge.empty {
    background: #f8e0d6;
    color: var(--danger);
  }

  .btn,
  .icon-btn {
    border: 0;
    border-radius: 8px;
    min-height: 40px;
    cursor: pointer;
    font-weight: 800;
    transition: transform 0.16s ease, box-shadow 0.16s ease, background 0.16s ease;
  }

  .btn {
    padding: 10px 14px;
  }

  .btn:hover,
  .icon-btn:hover {
    transform: translateY(-1px);
  }

  .btn.primary,
  .btn.checkout {
    background: linear-gradient(180deg, var(--primary) 0%, var(--primary-dark) 100%);
    color: #fffdf7;
    box-shadow: inset 0 -1px 0 rgba(43, 26, 16, 0.22);
  }

  .btn.primary:hover,
  .btn.checkout:hover {
    background: var(--primary-dark);
  }

  .btn.checkout {
    width: 100%;
    min-height: 50px;
    margin-top: 12px;
  }

  .btn.ghost {
    background: var(--panel-strong);
    color: var(--ink);
    border: 1px solid var(--line);
  }

  .btn.soft {
    background: var(--gold-soft);
    color: #4f321c;
    border: 1px solid rgba(214, 160, 42, 0.28);
  }

  .btn.danger,
  .danger-text {
    color: var(--danger);
  }

  .btn:disabled {
    cursor: not-allowed;
    opacity: 0.55;
    transform: none;
  }

  .cart-panel {
    position: sticky;
    top: 20px;
  }

  .cart-list {
    display: grid;
    gap: 10px;
    max-height: 460px;
    overflow: auto;
    padding-right: 4px;
  }

  .cart-item {
    display: grid;
    grid-template-columns: minmax(0, 1fr) 118px 36px;
    gap: 10px;
    align-items: center;
    padding: 12px;
    border: 1px solid var(--line);
    border-radius: 8px;
    background: var(--panel-strong);
  }

  .cart-product {
    display: grid;
    grid-template-columns: 48px minmax(0, 1fr);
    gap: 10px;
    align-items: center;
    min-width: 0;
  }

  .cart-thumb {
    width: 48px;
    height: 48px;
    border-radius: 8px;
    object-fit: cover;
    background: var(--brown-soft);
  }

  .cart-name {
    margin: 0 0 4px;
    font-weight: 850;
  }

  .cart-meta {
    color: var(--muted);
    font-size: 13px;
  }

  .qty-control {
    display: grid;
    grid-template-columns: 30px 1fr 30px;
    align-items: center;
    border: 1px solid var(--line);
    border-radius: 8px;
    overflow: hidden;
  }

  .qty-control button {
    min-height: 36px;
    border: 0;
    background: #f3e3c5;
    color: var(--ink);
    cursor: pointer;
    font-weight: 900;
  }

  .qty-control input {
    min-height: 36px;
    border: 0;
    border-left: 1px solid var(--line);
    border-right: 1px solid var(--line);
    border-radius: 0;
    text-align: center;
    padding: 4px;
  }

  .icon-btn {
    width: 36px;
    min-width: 36px;
    background: #f8e0d6;
    color: var(--danger);
  }

  .checkout-box {
    border-top: 1px solid var(--line);
    margin-top: 16px;
    padding-top: 16px;
  }

  .totals,
  .change-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
    margin-bottom: 14px;
  }

  .totals div,
  .change-row {
    background: #fff6e6;
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 12px;
  }

  .totals span,
  .change-row span,
  .stat-card span {
    display: block;
    color: var(--muted);
    font-size: 12px;
    font-weight: 800;
    margin-bottom: 5px;
    text-transform: uppercase;
  }

  .totals strong,
  .change-row strong,
  .stat-card strong {
    font-size: 20px;
  }

  .quick-payments {
    margin: 10px 0 14px;
  }

  .stats-row {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 14px;
    margin: 20px 0;
  }

  .stat-card {
    border-radius: 8px;
    padding: 16px;
    background: linear-gradient(135deg, #fffdf7 0%, #fff0bf 100%);
  }

  .table-wrap {
    overflow-x: auto;
  }

  table {
    width: 100%;
    border-collapse: collapse;
  }

  th,
  td {
    border-bottom: 1px solid var(--line);
    padding: 12px 10px;
    text-align: left;
    white-space: nowrap;
  }

  th {
    color: var(--muted);
    font-size: 12px;
    text-transform: uppercase;
    background: #fff7e8;
  }

  .empty-state {
    border: 1px dashed var(--line);
    border-radius: 8px;
    color: var(--muted);
    background: rgba(255, 253, 247, 0.62);
    padding: 18px;
    text-align: center;
  }

  .status-text {
    color: var(--muted);
    font-size: 13px;
    font-weight: 800;
  }

  .toast {
    position: fixed;
    right: 24px;
    bottom: 24px;
    z-index: 20;
    max-width: min(420px, calc(100vw - 48px));
    transform: translateY(20px);
    opacity: 0;
    pointer-events: none;
    border-radius: 8px;
    background: #2b1a10;
    color: #fff;
    padding: 12px 14px;
    box-shadow: var(--shadow);
    transition: opacity 0.2s ease, transform 0.2s ease;
  }

  .toast.show {
    opacity: 1;
    transform: translateY(0);
  }

  .receipt-dialog {
    width: min(460px, calc(100vw - 32px));
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 0;
    color: var(--ink);
    background: var(--panel-strong);
  }

  .receipt-dialog::backdrop {
    background: rgba(43, 26, 16, 0.48);
  }

  .receipt-header,
  .receipt-actions {
    padding: 16px;
  }

  .receipt-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-bottom: 1px solid var(--line);
  }

  .receipt-content {
    padding: 16px;
    font-family: ui-monospace, SFMono-Regular, Consolas, "Liberation Mono", monospace;
    font-size: 13px;
  }

  .receipt-line {
    display: flex;
    justify-content: space-between;
    gap: 12px;
    margin: 7px 0;
  }

  .receipt-separator {
    border-top: 1px dashed #cbbcac;
    margin: 12px 0;
  }

  @media (max-width: 980px) {
    .dashboard,
    .stats-row {
      grid-template-columns: 1fr;
    }

    .cart-panel {
      position: static;
    }
  }

  @media (max-width: 640px) {
    .app-shell {
      padding: 14px;
    }

    .topbar,
    .panel-header,
    .cart-item {
      grid-template-columns: 1fr;
    }

    .topbar,
    .panel-header {
      align-items: stretch;
    }

    .toolbar,
    .totals {
      grid-template-columns: 1fr;
    }

    .topbar-actions,
    .quick-payments {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
    }
  }

  @media print {
    body * {
      visibility: hidden;
    }

    .receipt-dialog,
    .receipt-dialog * {
      visibility: visible;
    }

    .receipt-dialog {
      position: absolute;
      inset: 0 auto auto 0;
      width: 100%;
      border: 0;
      box-shadow: none;
    }

    .receipt-header,
    .receipt-actions {
      display: none;
    }
  }
</style>
